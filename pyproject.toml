[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "remoteslurm"
version = "0.2.0"
description = "Fast, agent-friendly control of a remote Slurm login node over a persistent SSH connection (library + CLI + MCP server)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bradley Buchsbaum" }]
dependencies = [
  "mcp[cli]>=1.8.0,<2",
]

[project.urls]
Repository = "https://github.com/bbuchsbaum/remoteslurm"
Issues = "https://github.com/bbuchsbaum/remoteslurm/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
remoteslurm = "remoteslurm.cli:main"
rslurm = "remoteslurm.cli:main"
remoteslurm-mcp = "remoteslurm.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/remoteslurm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
markers = ["live: requires a live cluster (REMOTESLURM_LIVE=1)"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
per-file-ignores = { "src/remoteslurm/stub.py" = ["UP", "B904"] }

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["src/remoteslurm"]
